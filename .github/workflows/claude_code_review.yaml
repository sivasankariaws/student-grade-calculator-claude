# .github/workflows/claude_review.yml
# GitHub Actions workflow: Claude Code automated PR review
# Triggers on every Pull Request to main
# Uses the official Anthropic Claude Code GitHub Action

name: Claude Code PR Review

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

jobs:
  claude-review:
    name: Claude Code Automated Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pytest

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short
        continue-on-error: false


            If there are no blocking issues, end with:
            REVIEW_STATUS: APPROVED
